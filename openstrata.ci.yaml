# OpenStrata CI contract for the current workspace libraries.
# Plugin bundle cells will be added when the M4 FileFormat target lands.
schema: 1

bootstrap:
  ost:
    version: "0.22.8"
    repository: animu-sphere/open-strata

runners:
  windows-hosted:
    kind: github-hosted
    image: windows-2022
    billing:
      acknowledgement: required
  macos-arm64-hosted:
    kind: github-hosted
    image: macos-15
    billing:
      acknowledgement: required
  linux-hosted:
    kind: github-hosted
    image: ubuntu-24.04
    billing:
      acknowledgement: required

